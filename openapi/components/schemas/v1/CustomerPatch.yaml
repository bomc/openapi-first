type: object
properties:
    id:
      $ref: ../common/UuidId.yaml
    name:  
      $ref: CustomerName.yaml
    shipToAddress:
      $ref: CustomerAddressPatch.yaml  
    billToAddress:
      $ref: CustomerAddressPatch.yaml
    email:
      type: 
        - string
        - 'null'
      maxLength: 255
      minLength: 3
      example: john@springframework.guru
    phone:
      type: 
        - string
        - 'null'
      maxLength: 15
      minLength: 7
      example: 800-555-1212
    paymentMethods:
      type: 
        - array
        - 'null'
      items: 
        $ref: CustomerPaymentMethodPatch.yaml