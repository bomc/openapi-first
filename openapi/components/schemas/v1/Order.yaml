type: object  
properties: 
  id: 
    $ref: ../common/UuidId.yaml
  customer:
    $ref: OrderCustomer.yaml
  orderStatus:
    type: string
    enum: [NEW, HOLD, SHIPPED, DELIVERED, CLOSED]
    default: NEW
  shipmentInfo:
    type: 
      - string
      - 'null'
    minLength: 1
    maxLength: 255
  orderLines:
    type: array
    items:
      $ref: OrderLine.yaml
    description: The order lines of the order
  dateCreated:
    $ref: ../common/IsoTimestamp.yaml
  dateUpdated:
    $ref: ../common/IsoTimestamp.yaml
required:
  - customer
  - orderStatus
  - orderLines