type: object
properties: 
  id: 
    $ref: ../common/UuidId.yaml
  product:
    $ref: OrderProduct.yaml
  orderQuantity:
    type: integer
    description: The quantity of the product in the order
    minimum: 1
    maximum: 10000
    example: 2
  shipQuantity:
    type: 
      - integer
      - 'null'
    description: The quantity of the product shipped 
    minimum: 1
    maximum: 10000
    example: 2   
  dateCreated:
    $ref: ../common/IsoTimestamp.yaml
  dateUpdated:
    $ref: ../common/IsoTimestamp.yaml
required:
  - product
  - orderQuantity