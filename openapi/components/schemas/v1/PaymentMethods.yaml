type: object
properties: 
  id: 
    $ref: ../common/UuidId.yaml
  displayName: 
    type: string
    minLength: 2
    maxLength: 100
    example: My Chase Card
  cardNumber:
    type: integer
    example: 1234567890123456
  expiryMonth:
    type: integer
    example: 7
  expiryYear:
    type: integer
    example: 26
  cvv:
    type: integer
    example: 123
  dateCreated:
    $ref: ../common/IsoTimestamp.yaml
  dateUpdated:
    $ref: ../common/IsoTimestamp.yaml   
required: 
  - displayName
  - cardNumber
  - expiryMonth
  - expiryYear
  - cvv   