type: 
  - object
  - 'null'
properties: 
  id: 
    type: string
    format: uuid
    description: Unique identifier representing a specific customer address
  addressLine1: 
    type: 
      - string
      - 'null'
    description: Address Line 1
    minLength: 3
    maxLength: 100
    example: 123 Main Street
  addressLine2: 
    type: 
      - string
      - 'null'
    description: Address Line 2
    minLength: 3
    maxLength: 100
  city:
    type: 
      - string
      - 'null'
    description: City
    minLength: 2
    maxLength: 100
    example: St Petersburg
  state:
    type: 
      - string
      - 'null'
    description: 2 character state code
    minLength: 2
    maxLength: 2
    example: FL
  zip: 
    type: 
      - string
      - 'null'
    description: Zip Code 
    minLength: 5
    maxLength: 10  
    example: 33701     
required: 
  - id